#dark { display:none !important; position: left: 0; top: 0; width: 100%; height: 100%; background: #140606; opacity: 0.3; }
.hasimg .blob { display: none; }
.drift #bgimg { -webkit-animation: wallDrift 80s ease-in-out infinite alternate; animation: wallDrift 80s ease-in-out infinite alternate; }
@-webkit-keyframes wallDrift { from { -webkit-transform: translate3d(-1.2%, -0.8%, 0) scale(1); } to { -webkit-transform: translate3d(1.2%, 0.8%, 0) scale(1.03); } }
@keyframes wallDrift { from { transform: translate3d(-1.2%, -0.8%, 0) scale(1); } to { transform: translate3d(1.2%, 0.8%, 0) scale(1.03); } }
.blob { display:none !important; position: absolute; border-radius: 50%; will-change: transform; }
#b1 { left: -20%; top: -45%; width: 90%; height: 110%;
  background: radial-gradient(closest-side, rgba(104, 74, 168, 0.55), rgba(104, 74, 168, 0)); }
#b2 { right: -25%; top: -30%; width: 85%; height: 100%;
  background: radial-gradient(closest-side, rgba(52, 96, 170, 0.42), rgba(52, 96, 170, 0)); }
#b3 { left: 10%; bottom: -60%; width: 90%; height: 90%;
  background: radial-gradient(closest-side, rgba(180, 70, 100, 0.22), rgba(180, 70, 100, 0)); }
#shade { display:none !important; position: left: 0; top: 0; width: 100%; height: 100%;
  background: linear-gradient(to bottom, rgba(20,6,6,0.38) 0%, rgba(20,6,6,0.12) 25%, rgba(20,6,6,0) 45%, rgba(20,6,6,0.35) 100%); }
.drift #b1 { -webkit-animation: driftA 60s ease-in-out infinite alternate; animation: driftA 60s ease-in-out infinite alternate; }
.drift #b2 { -webkit-animation: driftB 75s ease-in-out infinite alternate; animation: driftB 75s ease-in-out infinite alternate; }
.drift #b3 { -webkit-animation: driftA 90s ease-in-out infinite alternate-reverse; animation: driftA 90s ease-in-out infinite alternate-reverse; }
@-webkit-keyframes driftA { from { -webkit-transform: translate3d(-3%, 0, 0); } to { -webkit-transform: translate3d(5%, 6%, 0); } }
@keyframes driftA { from { transform: translate3d(-3%, 0, 0); } to { transform: translate3d(5%, 6%, 0); } }
@-webkit-keyframes driftB { from { -webkit-transform: translate3d(4%, 2%, 0); } to { -webkit-transform: translate3d(-6%, -4%, 0); } }
@keyframes driftB { from { transform: translate3d(4%, 2%, 0); } to { transform: translate3d(-6%, -4%, 0); } }

/* ---------- Clock and weather ---------- */
#clock { position: absolute; left: 5vw; top: 6vh; line-height: 1; text-shadow: 0 0.15vh 0.5vh rgba(30, 8, 4, 0.55), 0 0.3vh 2.6vh rgba(30, 8, 4, 0.85); }
#time { font-size: 10.5vh; font-weight: 300; letter-spacing: -0.01em; font-family: "LG Smart UI", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
#ampm { font-size: 4.6vh; font-weight: 400; margin-left: 1vh; opacity: 0.9; }
#date { margin-top: 1.2vh; font-size: 3.6vh; opacity: 0.85; }
#logowrap { position: absolute; left: 0; top: 8.5vh; width: 100%; text-align: center; pointer-events: none; }
#logobox { display: inline-block; }

/* ---------- Real open-book spread ---------- */
#root { -webkit-perspective: 2200px; perspective: 2200px; }
#book {
  position:absolute; left:50%; top:56%; width:82vw; height:57vh;
  margin-left:-41vw; margin-top:-28.5vh; pointer-events:none;
  -webkit-transform-style:preserve-3d; transform-style:preserve-3d;
  z-index:1;
}
#book:before {
  content:""; position:absolute; left:0; top:0; width:100%; height:100%;
  border-radius:1.2vh 1.2vh 2.2vh 2.2vh;
  background:linear-gradient(90deg,#3a2115 0%,#6b4228 2%,#2e1b14 49.4%,#1d120e 50%,#6b4228 51%,#3a2115 100%);
  box-shadow:0 3vh 7vh rgba(0,0,0,.72), 0 0 0 .5vh rgba(22,12,8,.9);
}
#book:after {
  content:""; position:absolute; left:50%; top:1.3%; width:1.1%; height:97.4%;
  margin-left:-.55%; background:linear-gradient(90deg,rgba(40,22,12,.75),rgba(255,225,170,.35),rgba(30,16,10,.8));
  box-shadow:0 0 1.2vh rgba(0,0,0,.65);
}
#track { position:absolute; left:0; top:0; width:100%; height:100%; z-index:2;
  -webkit-transform-style:preserve-3d; transform-style:preserve-3d; }
.item {
  position:absolute; left:0; top:0; cursor:pointer; will-change:transform,opacity;
  -webkit-transform-style:preserve-3d; transform-style:preserve-3d;
}
.circle {
  position:absolute; left:0; top:0; width:100%; height:100%; overflow:hidden;
  border-radius:0 1.2vh 1.2vh 0;
  border:0; box-sizing:border-box;
  background:
    repeating-linear-gradient(0deg,rgba(126,91,47,.035) 0,rgba(126,91,47,.035) 1px,transparent 1px,transparent 5px),
    linear-gradient(135deg,#fff9e9 0%,#f0e2c4 62%,#e4d0a9 100%) !important;
  box-shadow:0 .9vh 2.2vh rgba(0,0,0,.42),inset 0 0 0 .35vh rgba(255,255,255,.52),inset 0 0 2vh rgba(110,73,35,.13);
  -webkit-transform-style:preserve-3d; transform-style:preserve-3d;
}
.item.left-page .circle { border-radius:1.2vh 0 0 1.2vh; }
.circle:before {
  content:""; position:absolute; right:0; top:0; width:10%; height:100%; z-index:4;
  background:linear-gradient(90deg,rgba(110,75,38,0),rgba(110,75,38,.12)); pointer-events:none;
}
.item.left-page .circle:before { right:auto; left:0; }
.circle:after {
  content:""; position:absolute; left:7%; right:7%; bottom:4%; height:1px;
  background:rgba(119,83,42,.25); pointer-events:none;
}
.ico,.glyph svg {
  position:absolute; left:50%; top:39%; width:36%; height:42%;
  margin-left:-18%; margin-top:-21%; object-fit:contain;
}
.ico { display:block; border:0; opacity:0; -webkit-transition:opacity .3s; transition:opacity .3s; }
.ico.in { opacity:1; }
.ico.cover { object-fit:contain; }
.ico.contain,.ico.pad { object-fit:contain; }
.ico.pad { box-sizing:border-box; padding:2%; }
.glyph { display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center; }
.glyph svg { width:34%; height:40%; }
.ltr { position:absolute; left:0; top:28%; width:100%; height:45%; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center;
  font-size:13vh; color:#6a4a2b; text-shadow:0 .2vh .5vh rgba(80,50,20,.2); }
.page-name {
  position:absolute; left:8%; right:8%; bottom:12%; text-align:center;
  color:#4b321e; font-size:3.2vh; line-height:1.18; font-weight:500;
  text-shadow:0 1px rgba(255,255,255,.5); white-space:normal; overflow:hidden;
  max-height:2.5em; word-wrap:break-word;
}
.page-number {
  position:absolute; bottom:5.5%; left:0; width:100%; text-align:center;
  color:rgba(91,63,35,.55); font-size:1.7vh; letter-spacing:.12em;
}
.item.turn-next .circle { -webkit-animation:realLeafNext .72s cubic-bezier(.2,.72,.18,1) both; animation:realLeafNext .72s cubic-bezier(.2,.72,.18,1) both; }
.item.turn-prev .circle { -webkit-animation:realLeafPrev .72s cubic-bezier(.2,.72,.18,1) both; animation:realLeafPrev .72s cubic-bezier(.2,.72,.18,1) both; }
@-webkit-keyframes realLeafNext {
  0%{-webkit-transform:rotateY(0deg);-webkit-transform-origin:left center;box-shadow:0 .8vh 1.5vh rgba(0,0,0,.3)}
  45%{-webkit-transform:rotateY(-92deg);-webkit-transform-origin:left center;box-shadow:-2vh 1vh 3vh rgba(0,0,0,.38)}
  55%{-webkit-transform:rotateY(-92deg);-webkit-transform-origin:left center}
  100%{-webkit-transform:rotateY(0deg);-webkit-transform-origin:left center}
}
@keyframes realLeafNext {
  0%{transform:rotateY(0deg);transform-origin:left center;box-shadow:0 .8vh 1.5vh rgba(0,0,0,.3)}
  45%{transform:rotateY(-92deg);transform-origin:left center;box-shadow:-2vh 1vh 3vh rgba(0,0,0,.38)}
  55%{transform:rotateY(-92deg);transform-origin:left center}
  100%{transform:rotateY(0deg);transform-origin:left center}
}
@-webkit-keyframes realLeafPrev {
  0%{-webkit-transform:rotateY(0deg);-webkit-transform-origin:right center}
  45%{-webkit-transform:rotateY(92deg);-webkit-transform-origin:right center;box-shadow:2vh 1vh 3vh rgba(0,0,0,.38)}
  55%{-webkit-transform:rotateY(92deg);-webkit-transform-origin:right center}
  100%{-webkit-transform:rotateY(0deg);-webkit-transform-origin:right center}
}
@keyframes realLeafPrev {
  0%{transform:rotateY(0deg);transform-origin:right center}
  45%{transform:rotateY(92deg);transform-origin:right center;box-shadow:2vh 1vh 3vh rgba(0,0,0,.38)}
  55%{transform:rotateY(92deg);transform-origin:right center}
  100%{transform:rotateY(0deg);transform-origin:right center}
}
/* ---------- Label and sections ---------- */
#label { position: absolute; left: 0; width: 100%; text-align: center; pointer-events: none; will-change: transform, opacity; }
#title { font-size: 5vh; font-weight: 400; line-height: 1.25; max-width: 60vw; margin: 0 auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

#empty { position: absolute; left: 0; top: 48%; width: 100%; text-align: center; font-size: 3vh; opacity: 0.6; display: none; }
#preview { position: absolute; left: 50%; top: 1.6vh; padding: 0.4vh 1.4vh; border-radius: 2vh; font-size: 1.5vh;

</div>

<script>
(function () {
  'use strict';

  /* =====================================================================

    showDate: true,
    // Weather detects the TV's location (permission required where supported).

    tileSize: 1.2,            // page scale
    darkening: 0,              // wallpaper removed
    backgroundImage: '',      // wallpaper disabled
    driftBackground: false,   // no wallpaper movement
    pixelShift: true,         // nudges the screen a few pixels every few minutes to protect OLED panels
    showInputs: true,
    hideUnusedInputs: true,
    showMoreApps: true,       // apps the owner put in "More apps" get their own section
    showLgHome: true          // an "LG Home" tile at the end of the apps
  };

  /* =====================================================================
     Helpers (ES5 only)
     ===================================================================== */
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function ease(t) { return t * t * (3 - 2 * t); }
  function easeOut(t) { var u = 1 - t; return 1 - u * u * u; }
  function nowMs() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function r1(n) { return Math.round(n * 10) / 10; }

  var root = $('root'), track = $('track'), ring = $('ring'), glow = $('glow');
  var labelEl = $('label'), titleEl = $('title'), subEl = $('sub'), pillsEl = $('pills');
  var toastEl = $('toast'), emptyEl = $('empty'), arcPath = $('arcpath'), arcSvg = $('arc');

  /* =====================================================================

  function makeDemo() {
    var ico = {
      netflix: svgUri('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#000"/><text x="40" y="58" font-size="56" font-family="Arial" font-weight="bold" fill="#e50914" text-anchor="middle">N</text></svg>'),

      plex: svgUri('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#1f2326"/><text x="40" y="49" font-size="24" font-family="Arial" font-weight="bold" fill="#e5a00d" text-anchor="middle">plex</text></svg>'),
      spotify: svgUri('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#121212"/><circle cx="40" cy="40" r="22" fill="#1ed760"/><path d="M26 33q15-5 29 2M28 41q13-4 24 2M30 48q10-3 19 1" stroke="#121212" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>')
    };
    var apps = [
      { id: 'netflix', title: 'Netflix', icon: ico.netflix }, { id: 'prime', title: 'Prime Video', icon: ico.prime },
      { id: 'youtube', title: 'YouTube', icon: ico.youtube }, { id: 'plex', title: 'Plex', icon: ico.plex },
      { id: 'spotify', title: 'Spotify - Music and Podcasts', icon: ico.spotify }, { id: 'web', title: 'Web Browser', icon: null },
      { id: 'disney', title: 'Disney+', icon: null }, { id: 'apple', title: 'Apple TV', icon: null },
      { id: 'photos', title: 'Photos', icon: null }, { id: 'music', title: 'Music', icon: null },
      { id: 'sports', title: 'Sports', icon: null, folder: true }, { id: 'kids', title: 'Kids', icon: null, folder: true }

  /* =====================================================================

     ===================================================================== */
  var items = [];        // flat list in display order
  var sections = [];     // { name, start, count }

  var raf = 0, last = 0, covered = false, opening = false;
  var introStart = 0, introT = 0, INTRO_LEN = 1.3;
  var shownIdx = -1;

  function itemKey(it) { return it.kind + ':' + (it.id || ''); }

  function build(cat) {
    var apps = [], more = [], inputs = [], i, a, p;
    var list = (cat && cat.apps) || [];
    for (i = 0; i < list.length; i++) {
      a = list[i];
      if (a.hidden || a.id === 'com.webos.app.home') continue;
      var it = { kind: 'app', id: a.id, title: a.title || a.id, icon: a.icon || null };
      if (a.folder && CONFIG.showMoreApps) more.push(it); else if (!a.folder) apps.push(it);
    }
    if (CONFIG.showLgHome) apps.push({ kind: 'lg', id: 'lg', title: 'LG Home', glyph: 'home' });
    if (CONFIG.showInputs) {
      list = (cat && cat.inputs) || [];
      for (i = 0; i < list.length; i++) {
        p = list[i];
        if (p.hidden || (CONFIG.hideUnusedInputs && p.unused)) continue;
        inputs.push({ kind: 'input', id: p.id, title: p.title || p.id, glyph: p.tuner ? 'tuner' : 'hdmi' });
      }
    }
    var groups = [['Apps', apps], ['Inputs', inputs], ['More apps', more]];
    var flat = [], secs = [], g, k;
    for (g = 0; g < groups.length; g++) {
      if (!groups[g][1].length) continue;
      var sec = { name: groups[g][0], start: flat.length, count: groups[g][1].length };
      for (k = 0; k < groups[g][1].length; k++) { groups[g][1][k].sec = secs.length; flat.push(groups[g][1][k]); }
      secs.push(sec);
    }
    return { items: flat, sections: secs };
  }

  /* ---------- Icons: make every kind of icon fit a circle ---------- */
  var GLYPHS = {
    hdmi: '<svg viewBox="0 0 48 48"><path d="M9 15h30v11l-6 8H15l-6-8z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M17 21h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>',
    tuner: '<svg viewBox="0 0 48 48"><rect x="7" y="16" width="34" height="23" rx="4" fill="none" stroke="#fff" stroke-width="3"/><path d="M17 8l7 8 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    home: '<svg viewBox="0 0 48 48"><path d="M7 23L24 9l17 14M12 20v19h24V20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  var GLYPH_BG = {
    hdmi: 'linear-gradient(145deg, #4a6ee0, #223a8f)',
    tuner: 'linear-gradient(145deg, #8a5be0, #43268f)',
    home: 'linear-gradient(145deg, #34a37a, #176447)'
  };

  function letterTile(it) {
    var s = (it.title || '?').replace(/[^A-Za-z0-9\u00C0-\uFFFF]/g, '');
    var ch = s ? s.charAt(0).toUpperCase() : '?', h = 0, i;
    for (i = 0; i < (it.title || '').length; i++) h = (h * 31 + it.title.charCodeAt(i)) % 360;
    it.circle.style.background = 'linear-gradient(145deg, hsl(' + h + ',55%,42%), hsl(' + ((h + 35) % 360) + ',60%,24%))';
    var d = document.createElement('div');
    d.className = 'ltr';
    d.textContent = ch;
    it.circle.appendChild(d);
  }

  // Looks at the icon's edges to decide how to fit it in a circle.
  function analyse(img) {
    var res = { fit: 'contain', bg: null };
    var w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return res;
    var ratio = w / h, square = ratio > 0.88 && ratio < 1.14;
    try {
      var N = 40, c = document.createElement('canvas');
      c.width = N; c.height = N;
      var g = c.getContext('2d');
      g.drawImage(img, 0, 0, N, N);
      var mid = N >> 1, lo = 1, hi = N - 2;
      var edges = [[mid, lo], [mid, hi], [lo, mid], [hi, mid]];
      var corners = [[lo, lo], [hi, lo], [lo, hi], [hi, hi]];
      var all = edges.concat(corners), k, o, r = 0, gr = 0, b = 0, n = 0, edgeOpaque = 0;
      var px = g.getImageData(0, 0, N, N).data;       // one read for all the sample points
      for (k = 0; k < all.length; k++) {
        o = (all[k][1] * N + all[k][0]) * 4;
        if (px[o + 3] > 235) {
          r += px[o]; gr += px[o + 1]; b += px[o + 2]; n++;
          if (k < 4) edgeOpaque++;
        }
      }
      var full = edgeOpaque >= 3;                     // artwork reaches the edges
      if (n) res.bg = 'rgb(' + Math.round(r / n) + ',' + Math.round(gr / n) + ',' + Math.round(b / n) + ')';
      if (full && square) res.fit = 'cover';          // fills the whole circle
      else if (full) res.fit = 'contain';             // wide or tall artwork: whole picture, edge colour behind it
      else { res.fit = 'pad'; res.bg = null; }        // transparent logo: breathing room so it is never clipped
    } catch (e) {
      res.fit = square ? 'cover' : 'pad';             // canvas blocked: sensible guess
    }
    return res;
  }

  function loadIcon(it) {
    if (it.loaded || !it.icon) return;
    it.loaded = true;
    var img = new Image();
    img.alt = '';
    img.onload = function () {
      var a = analyse(img);
      if (a.bg) it.circle.style.background = a.bg;
      img.className = 'ico ' + a.fit;
      it.circle.insertBefore(img, it.circle.firstChild);
      setTimeout(function () { img.className += ' in'; }, 20);
    };
    img.onerror = function () { letterTile(it); };
    img.src = it.icon;
  }

  function makeItem(it, idx) {
    var el = document.createElement('div'), c = document.createElement('div');
    el.className = 'item'; c.className = 'circle';
    var nm = document.createElement('div'), pg = document.createElement('div');
    nm.className = 'page-name'; nm.textContent = it.title;
    pg.className = 'page-number'; pg.textContent = String(idx + 1);
    c.appendChild(nm); c.appendChild(pg);
    el.appendChild(c);
    it.el = el; it.circle = c; it.idx = idx; it.shown = false; it.loaded = false;
    if (it.glyph) {
      c.className += ' glyph';
      c.style.background = GLYPH_BG[it.glyph];
      c.insertAdjacentHTML('afterbegin', GLYPHS[it.glyph]);
    } else if (!it.icon) {
      letterTile(it);
    }
    el.style.display = 'none';
    el.addEventListener('click', function () { clickItem(it); });
    track.appendChild(el);
  }

  /* =====================================================================
     Layout and drawing
     ===================================================================== */
  function layout() {
    W = window.innerWidth || document.documentElement.clientWidth || 1920;
    H = window.innerHeight || document.documentElement.clientHeight || 1080;
    BIG = Math.round(Math.min(W * 0.385, H * 0.56) * CONFIG.tileSize / 1.2);
    RING = 0; R = W * 0.9; CX = W / 2; FY = Math.round(H * 0.56);
    SP = BIG; EX = 0;
    var pageW = Math.round(Math.min(W * 0.385, H * 0.56) * CONFIG.tileSize / 1.2);
    var pageH = Math.round(Math.min(H * 0.56, W * 0.46));
    var book = $('book');
    book.style.width = (pageW * 2) + 'px';
    book.style.height = pageH + 'px';
    book.style.left = '50%';
    book.style.top = '56%';
    book.style.marginLeft = (-pageW) + 'px';
    book.style.marginTop = (-pageH / 2) + 'px';
    labelEl.style.top = Math.round(FY + pageH * 0.53) + 'px';
    var i;
    for (i = 0; i < items.length; i++) {
      items[i].el.style.width = pageW + 'px';
      items[i].el.style.height = pageH + 'px';
    }
  }

  /* =====================================================================
     Soft paper page-turn sound (Web Audio; no external sound file needed)
     Audio is created only after the viewer interacts, as required by TV browsers.
     ===================================================================== */
  var pageAudio = null;
  function playPageTurn(direction) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!pageAudio) pageAudio = new AC();
      if (pageAudio.state === 'suspended' && pageAudio.resume) pageAudio.resume();
      var ctx = pageAudio, t = ctx.currentTime;
      var duration = 0.34;
      var frames = Math.max(1, Math.floor(ctx.sampleRate * duration));
      var buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var j = 0; j < frames; j++) {
        var fadeIn = Math.min(1, j / (ctx.sampleRate * 0.025));
        var fadeOut = Math.pow(Math.max(0, 1 - j / frames), 1.8);
        data[j] = (Math.random() * 2 - 1) * fadeIn * fadeOut;
      }
      var source = ctx.createBufferSource();
      var filter = ctx.createBiquadFilter();
      var gain = ctx.createGain();
      source.buffer = buffer;
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(direction > 0 ? 1850 : 1450, t);
      filter.frequency.exponentialRampToValueAtTime(520, t + duration);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.105, t + 0.045);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      source.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      source.start(t); source.stop(t + duration + 0.015);
    } catch (e) { /* Sound is optional; navigation must always keep working. */ }
  }

  function render() {
    var n = items.length, i, it, d, near = clamp(Math.round(pos), 0, Math.max(0,n-1));
    var pageW = BIG, pageH = Math.round(Math.min(H * 0.56, W * 0.46));
    for (i = 0; i < n; i++) {
      it = items[i];
      d = i - pos;
      if (i < near - 1 || i > near) {
        if (it.shown) { it.el.style.display = 'none'; it.shown = false; }
        continue;
      }
      if (!it.shown) { it.el.style.display = 'block'; it.shown = true; loadIcon(it); }
      var leftPage = (i < near);
      var x = leftPage ? (CX - pageW) : CX;
      var y = FY - pageH / 2;
      it.el.style.left = '0px';
      it.el.style.width = pageW + 'px';
      it.el.style.height = pageH + 'px';
      it.el.style.opacity = '1';
      it.el.style.zIndex = leftPage ? 2 : 3;
      it.el.style.transform = 'translate3d(' + Math.round(x) + 'px,' + Math.round(y) + 'px,0)';
      it.el.className = leftPage ? 'item left-page' : 'item right-page';
      var pn = it.circle.getElementsByClassName('page-number')[0];
      if (pn) pn.textContent = String(i + 1);
    }
    if (n) {
      if (near !== shownIdx) {
        var oldShown = shownIdx;
        shownIdx = near;
        setLabel(near);
        if (oldShown >= 0) playPageTurn(near > oldShown ? 1 : -1);
        if (oldShown >= 0 && items[near] && items[near].el) {
          var page = items[near].el;
          page.className = 'item right-page ' + (near > oldShown ? 'turn-next' : 'turn-prev');
          if (page._turnTimer) clearTimeout(page._turnTimer);
          page._turnTimer = setTimeout(function () {
            page.className = 'item right-page';
            page._turnTimer = 0;
          }, 780);
        }
      }
      labelEl.style.opacity = '0';
      labelEl.style.transform = 'translate3d(0,0,0)';
    }
  }

  function setLabel(idx) {
    var it = items[idx], s, k, pills;
    if (!it) return;
    s = sections[it.sec];
    titleEl.textContent = it.title;
    subEl.textContent = s.name + '  \u00B7  ' + (idx - s.start + 1) + ' / ' + s.count;
    pills = pillsEl.childNodes;
    for (k = 0; k < pills.length; k++) pills[k].className = (k === it.sec) ? 'pill on' : 'pill';
  }

  function buildPills() {
    pillsEl.innerHTML = '';
    var k;
    for (k = 0; k < sections.length; k++) {
      (function (idx) {
        var d = document.createElement('div');
        d.className = 'pill';
        d.textContent = sections[idx].name;
        d.addEventListener('click', function () { go(sections[idx].start); });
        pillsEl.appendChild(d);
      })(k);
    }
    pillsEl.style.display = sections.length > 1 ? 'block' : 'none';
  }

  /* =====================================================================
     Animation loop: a critically damped spring drives pos toward target.
     It stops by itself when everything has settled, so the TV is idle.
     ===================================================================== */
  function frame() {
    raf = 0;
    if (covered) return;
    var t = nowMs();
    var dt = last ? (t - last) / 1000 : 0.016;
    last = t;
    if (dt > 0.05) dt = 0.05;
    var steps = Math.ceil(dt / 0.008), h = dt / steps, i, x;
    for (i = 0; i < steps; i++) {
      x = target - pos;
      vel += (260 * x - 29 * vel) * h;
      if (vel > 40) vel = 40; else if (vel < -40) vel = -40;
      pos += vel * h;
    }
    var settled = false;
    if (Math.abs(target - pos) < 0.0008 && Math.abs(vel) < 0.01) { pos = target; vel = 0; settled = true; }
    introT = (t - introStart) / 1000;
    render();
    if (!settled || introT < INTRO_LEN) raf = requestAnimationFrame(frame);
    else last = 0;
  }

  function kick() {
    if (!raf && !covered) { last = 0; raf = requestAnimationFrame(frame); }
  }

  function playIntro() { introStart = nowMs(); introT = 0; kick(); }

  /* =====================================================================
     Navigation
     ===================================================================== */
  function bounce(dir) { vel += dir * 4.5; kick(); }

  function go(idx) {
    if (!items.length) return;
    idx = clamp(idx, 0, items.length - 1);
    if (idx === target) return;
    target = idx;
    kick();
  }

  function move(delta) {
    if (!items.length) return;
    var nt = clamp(target + delta, 0, items.length - 1);
    if (nt === target) { bounce(delta < 0 ? -1 : 1); return; }
    target = nt;
    kick();
  }

  function section(dir) {
    if (sections.length < 2) { bounce(dir); return; }
    var cur = items[target] ? items[target].sec : 0, nx = cur + dir;
    if (nx < 0 || nx >= sections.length) { bounce(dir < 0 ? -1 : 1); return; }
    go(sections[nx].start);
  }

  function clickItem(it) {
    if (it.idx === target) openFocused(); else go(it.idx);
  }

  var toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.className = 'on';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ''; }, 2600);
  }

  var openTimer = 0;
  function openFocused() {
    var it = items[target];
    if (!it || opening) return;
    opening = true;
    root.className = (root.className || '').replace(/\s*press/g, '') + ' press';
    var finish = function (err) {
      clearTimeout(openTimer);
      openTimer = setTimeout(function () { opening = false; endPress(); }, err ? 100 : 700);
      if (err) toast('Could not open ' + it.title);
    };
    openTimer = setTimeout(function () { opening = false; endPress(); }, 4000);
    if (it.kind === 'lg') G.lgHome(finish); else G.open(it.kind, it.id, finish);
  }

  function endPress() { root.className = (root.className || '').replace(/\s*press/g, ''); }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode, ok = true;
    switch (k) {
      case 37: move(-1); break;                   // left
      case 39: move(1); break;                    // right
      case 38: section(-1); break;                // up: previous section
      case 40: section(1); break;                 // down: next section
      case 33: case 427: move(-5); break;         // page up / channel up: jump five
      case 34: case 428: move(5); break;          // page down / channel down
      case 35: go(items.length - 1); break;
      case 36: go(0); break;
      case 13: if (!e.repeat) openFocused(); break;
      case 461: case 27: case 8: go(0); break;    // Back: return to the first app
      default: ok = false;
    }
    if (ok) e.preventDefault();
  });

  // Magic Remote: scroll wheel steps one icon, click focuses then opens.
  var wheelT = 0;
  window.addEventListener('wheel', function (e) {
    var t = nowMs();
    if (t - wheelT < 110) return;
    wheelT = t;
    var d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (d > 0) move(1); else if (d < 0) move(-1);
    e.preventDefault();
  });

  window.addEventListener('resize', function () { layout(); render(); });

  /* =====================================================================
     Clock, weather, OLED shift
     ===================================================================== */
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var lastMinute = -1;

  function tickClock() {
    var d = new Date(), m = d.getMinutes();
    if (m === lastMinute) return;
    lastMinute = m;
    var h = d.getHours();
    if (CONFIG.clock24h) {
      $('time').textContent = pad2(h) + ':' + pad2(m);
      $('ampm').textContent = '';
    } else {
      $('time').textContent = ((h % 12) || 12) + ':' + pad2(m);
      $('ampm').textContent = h < 12 ? 'AM' : 'PM';
    }
    $('date').textContent = CONFIG.showDate ? DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() : '';
  }

  var WX = {
    sun: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="8"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11 11l3.5 3.5M33.5 33.5L37 37M37 11l-3.5 3.5M14.5 33.5L11 37"/></svg>',
    moon: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M30 8a16 16 0 1 0 10 28A13 13 0 0 1 30 8z"/></svg>',
    cloud: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M14 36a8 8 0 0 1-1-16 11 11 0 0 1 21 2 7 7 0 0 1 0 14z"/></svg>',
    rain: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 30a8 8 0 0 1-1-16 11 11 0 0 1 21 2 7 7 0 0 1 0 14z"/><path d="M17 37l-2 5M25 37l-2 5M33 37l-2 5"/></svg>',
    snow: '<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M24 6v36M8.4 15l31.2 18M8.4 33l31.2-18"/></svg>'
  };

  function wxIcon(code, day) {
    if (code === 0 || code === 1) return day ? WX.sun : WX.moon;
    if (code === 2 || code === 3 || code === 45 || code === 48) return WX.cloud;
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return WX.snow;
    if (code >= 51) return WX.rain;
    return WX.cloud;
  }

  var wxAt = 0, wxLocating = false, wxLocationReady = false;
  function setWeatherLocation(lat, lon, city) {
    CONFIG.weather.lat = lat;
    CONFIG.weather.lon = lon;
    if (city) CONFIG.weather.city = city;
    wxLocationReady = true;
    wxAt = 0;
    loadWeather();
  }
  function lookupCity(lat, lon, done) {
    try {
      var g = new XMLHttpRequest();
      g.open('GET', 'https://geocoding-api.open-meteo.com/v1/reverse?latitude=' +
        encodeURIComponent(lat) + '&longitude=' + encodeURIComponent(lon) + '&language=en&format=json');
      g.timeout = 10000;
      g.onload = function () {
        var city = '';
        try {
          var r = JSON.parse(g.responseText).results;
          if (r && r.length) city = r[0].name || r[0].admin1 || '';
        } catch (e) {}
        done(city);
      };
      g.onerror = g.ontimeout = function () { done(''); };
      g.send();
    } catch (e) { done(''); }
  }
  function useApproximateIpLocation() {
    try {
      var ip = new XMLHttpRequest();
      ip.open('GET', 'https://ipapi.co/json/');
      ip.timeout = 12000;
      ip.onload = function () {
        try {
          var d = JSON.parse(ip.responseText);
          if (typeof d.latitude === 'number' && typeof d.longitude === 'number') {
            setWeatherLocation(d.latitude, d.longitude, [d.city, d.region_code].filter(Boolean).join(', '));
          }
        } catch (e) {}
      };
      ip.onerror = ip.ontimeout = function () {};
      ip.send();
    } catch (e) {}
  }
  function detectWeatherLocation() {
    if (wxLocating || wxLocationReady) return;
    wxLocating = true;
    if (navigator.geolocation && navigator.geolocation.getCurrentPosition) {
      navigator.geolocation.getCurrentPosition(function (position) {
        var lat = position.coords.latitude, lon = position.coords.longitude;
        lookupCity(lat, lon, function (city) { setWeatherLocation(lat, lon, city); });
      }, function () {
        useApproximateIpLocation();
      }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 30 * 60 * 1000 });
    } else {
      useApproximateIpLocation();
    }
  }
  function loadWeather() {
    var w = CONFIG.weather;
    if (!w || w.lat === null || w.lon === null) return;
    if (nowMs() - wxAt < 20 * 60 * 1000 && wxAt) return;
    wxAt = nowMs();
    try {
      var x = new XMLHttpRequest();
      x.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=' + w.lat + '&longitude=' + w.lon +
        '&current=temperature_2m,weather_code,is_day&temperature_unit=' + (w.fahrenheit ? 'fahrenheit' : 'celsius'));
      x.timeout = 15000;
      x.onload = function () {
        try {
          var c = JSON.parse(x.responseText).current;
          $('wtemp').textContent = Math.round(c.temperature_2m) + '\u00B0';
          $('wicon').innerHTML = wxIcon(c.weather_code, c.is_day === 1);
          $('wcity').textContent = w.city || 'Local weather';
          $('weather').style.display = 'block';
        } catch (e) {}
      };
      x.onerror = x.ontimeout = function () { wxAt = 0; };
      x.send();
    } catch (e) { wxAt = 0; }
  }

  var clockTimer = 0, shiftTimer = 0, wxTimer = 0;
  function startTimers() {
    stopTimers();
    tickClock(); detectWeatherLocation(); loadWeather();
    clockTimer = setInterval(tickClock, 5000);
    wxTimer = setInterval(loadWeather, 5 * 60 * 1000);
    if (CONFIG.pixelShift) {
      shiftTimer = setInterval(function () {
        var dx = Math.round(Math.random() * 10 - 5), dy = Math.round(Math.random() * 10 - 5);
        root.style.transform = 'translate3d(' + dx + 'px,' + dy + 'px,0)';
      }, 150000);
    }
  }
  function stopTimers() { clearInterval(clockTimer); clearInterval(shiftTimer); clearInterval(wxTimer); }

  /* =====================================================================
     Loading the TV's apps
     ===================================================================== */
  function setCovered(c) {
    covered = c;
    var cls = root.className || '';
    if (c) {
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      stopTimers();
      root.className = (cls.replace(/\s*drift/g, '') + ' still').replace(/\s*press/g, '');
    } else {
      opening = false;
      root.className = (CONFIG.driftBackground ? 'drift' : '') + (hasImg ? ' hasimg' : '');
      startTimers();
      playIntro();
    }
  }

  function refresh(keepKey) {
    G.catalogue(function (err, cat) {
      if (err || !cat) { toast('Could not read the TV\u2019s apps'); setTimeout(function () { refresh(keepKey); }, 4000); return; }
      var b = build(cat), i, keep = 0;
      track.innerHTML = '';
      items = b.items; sections = b.sections;
      for (i = 0; i < items.length; i++) {
        makeItem(items[i], i);
        if (keepKey && itemKey(items[i]) === keepKey) keep = i;
      }
      target = keep; pos = keep; vel = 0; shownIdx = -1;
      buildPills(); layout();
      emptyEl.style.display = items.length ? 'none' : 'block';
      if (!keepKey) playIntro(); else { render(); kick(); }
    });
  }

  /* ---------- Logo ---------- */
  (function () {
    var L = CONFIG.logo, el = $('logo'), bar = $('logobar'), shown = false;
    if (!L || !L.text) { bar.style.display = 'none'; return; }
    el.textContent = L.text;
    if (L.font) el.style.fontFamily = '"' + L.font + '", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif';
    function reveal() {
      if (shown) return;
      shown = true;
      el.className = 'on'; bar.className = 'on';
    }
    if (L.fontUrl) {
      var link = document.createElement('link');   // added after start so a slow network never delays the launcher
      link.rel = 'stylesheet';
      link.href = L.fontUrl;
      link.onload = function () {
        if (document.fonts && document.fonts.load) document.fonts.load('700 1em "' + L.font + '"').then(reveal, reveal);
        else setTimeout(reveal, 300);
      };
      link.onerror = reveal;
      document.head.appendChild(link);
      setTimeout(reveal, 4000);
    } else if (document.fonts && document.fonts.load) {
      document.fonts.load('1em "' + L.font + '"').then(reveal, reveal);
      setTimeout(reveal, 1500);
    } else {
      reveal();
    }
  })();

  /* ---------- go ---------- */
  if (CONFIG.backgroundImage) $('bgimg').style.backgroundImage = 'url("' + CONFIG.backgroundImage + '")';
  var bgStyle = window.getComputedStyle ? window.getComputedStyle($('bgimg')).backgroundImage : 'none';
  var hasImg = !!CONFIG.backgroundImage || (bgStyle && bgStyle !== 'none');
  if (hasImg) $('bgimg').style.display = 'block';
  $('dark').style.opacity = CONFIG.darkening;
  root.className = (CONFIG.driftBackground ? 'drift' : '') + (hasImg ? ' hasimg' : '');

  covered = !!(G.isCovered && G.isCovered());
  layout();
  tickClock();
  introStart = nowMs();
  refresh(null);
  if (!covered) startTimers();

  G.onCovered(setCovered);
  G.onHome(function () { endPress(); go(0); });
  G.onChanged(function () { refresh(items[target] ? itemKey(items[target]) : null); });
})();
</script>

<!-- Wallpaper, embedded as an image. To use another picture, set backgroundImage in CONFIG above, or replace this block. -->
</body>
</html>
